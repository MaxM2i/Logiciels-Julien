<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b5cab">
    <title>Log de forage</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <div class="brand">LOG DE FORAGE<small>Coupe de forage / sondage</small></div>
                <button class="burger" id="burger" type="button" aria-label="Ouvrir le menu"
                    aria-expanded="false" aria-controls="nav">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <nav class="nav" id="nav"><button data-view="dashboard">Accueil</button><button
                    data-view="projet">Projet</button><button data-view="lithologie">Lithologie</button><button
                    data-view="tubage">Équipements / tubage</button><button
                    data-view="developpement">Développement</button><button data-view="synthese">Synthèse</button><button
                    data-view="fiche">Fiche de poste</button><button
                    data-view="admin">Administration</button></nav>
        </aside>
        <main class="main">
            <div id="app"></div>
        </main>
    </div>
    <div id="modal"></div>
    <script>
        /* Menu burger (mobile / tablette) */
        (function () {
            var sidebar = document.getElementById('sidebar');
            var burger = document.getElementById('burger');
            var nav = document.getElementById('nav');
            function setOpen(open) {
                document.body.classList.toggle('menu-open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
                burger.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
            }
            burger.addEventListener('click', function (e) {
                e.stopPropagation();
                setOpen(!document.body.classList.contains('menu-open'));
            });
            /* Ferme le menu après un clic sur une entrée de navigation */
            nav.addEventListener('click', function (e) {
                if (e.target && e.target.closest && e.target.closest('button')) setOpen(false);
            });
            /* Ferme le menu si on tape sur le voile ou hors du menu */
            document.addEventListener('click', function (e) {
                if (!document.body.classList.contains('menu-open')) return;
                if (sidebar.contains(e.target)) return;
                setOpen(false);
            });
            /* Ferme le menu avec la touche Échap */
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') setOpen(false);
            });
        })();
    </script>
    <script src="../shared/app-utils.js"></script>
    <script src="app.js"></script>
</body>

</html>
