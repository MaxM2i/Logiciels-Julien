<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Logiciels Julien</title>
    <style>
        body {
            font-family: Segoe UI, Arial;
            background: #f3f6fa;
            color: #172033;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center
        }

        .box {
            width: min(900px, 90vw);
            text-align: center
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-top: 28px
        }

        .card {
            background: #fff;
            border: 1px solid #dbe2ea;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(23, 32, 51, .08)
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 13px 18px;
            background: #0b5cab;
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        .card:nth-child(2) button {
            background: #7a3fb5
        }

        small {
            color: #667085
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Logiciels Julien</h1>
        <p><small>Applications métier — version 1</small></p>
        <div class="cards">
            <div class="card">
                <h2>Log de forage</h2>
                <p>Créer et générer une coupe de forage / sondage.</p><button
                    onclick="location.href='../log-forage/index.html'">Ouvrir</button>
            </div>
            <div class="card">
                <h2>Analyse des risques</h2>
                <p>Construire une analyse et les fiches de poste associées.</p><button
                    onclick="location.href='../analyse-risques/index.html'">Ouvrir</button>
            </div>
        </div>
    </div>
</body>

</html>
